name: Deploy to Aliyun

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy frontend file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          HOST: 47.114.120.73
          USERNAME: admin
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SOURCE: "进度管理系统.html"
          TARGET: "/var/www/store-progress-manager/"
          strip_components: 0

      - name: Copy backend files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          HOST: 47.114.120.73
          USERNAME: admin
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SOURCE: "backend/server.js"
          TARGET: "/var/www/store-progress-manager/backend/"
          strip_components: 0

      - name: Restart backend and set permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          HOST: 47.114.120.73
          USERNAME: admin
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chmod 644 /var/www/store-progress-manager/进度管理系统.html
            cp /var/www/store-progress-manager/backend/server.js /var/www/store-progress-manager/backend/server.js.new
            mv /var/www/store-progress-manager/backend/server.js.new /var/www/store-progress-manager/backend/server.js
            pm2 restart store-progress-api || pm2 start /var/www/store-progress-manager/backend/server.js --name store-progress-api
            echo "Deploy completed at $(date)"
