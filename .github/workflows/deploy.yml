# Prepare a program package only when explicitly requested.
# No SSH credentials, production uploads, service restarts, or data restoration.
name: Prepare reviewed release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: store-progress-release-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check backend/server.js
      - name: Package code only
        shell: bash
        run: |
          set -euo pipefail
          tar -czf program-only.tar.gz -- \
            进度管理系统.html xlsx.min.js echarts.min.js sync-core.js sync-client.js backend/server.js backend/sync-store.js \
            package.json package-lock.json node_modules
          sha256sum program-only.tar.gz > program-only.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-program-${{ github.sha }}
          path: |
            program-only.tar.gz
            program-only.tar.gz.sha256
          retention-days: 7
