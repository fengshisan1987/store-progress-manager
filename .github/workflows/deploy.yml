name: Deploy to Aliyun

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy frontend file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          HOST: 47.114.120.73
          USERNAME: admin
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SOURCE: "进度管理系统.html"
          TARGET: "/var/www/store-progress-manager/"
          strip_components: 0

      - name: Copy backend file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          HOST: 47.114.120.73
          USERNAME: admin
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SOURCE: "backend/server.js"
          TARGET: "/var/www/store-progress-manager/backend/"
          strip_components: 1

      - name: Restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          HOST: 47.114.120.73
          USERNAME: admin
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chmod 644 /var/www/store-progress-manager/进度管理系统.html
            echo "=== Verifying role API exists ==="
            grep -n 'PUT.*role' /var/www/store-progress-manager/backend/server.js || (echo "ERROR: role API not found" && exit 1)
            echo "=== Stopping old backend ==="
            pm2 delete store-progress-api 2>/dev/null || true
            fuser -k 3001/tcp 2>/dev/null || true
            fuser -k 3002/tcp 2>/dev/null || true
            fuser -k 3003/tcp 2>/dev/null || true
            echo "=== Starting new backend ==="
            pm2 start /var/www/store-progress-manager/backend/server.js --name store-progress-api
            sleep 3
            echo "=== Checking backend status ==="
            pm2 list
            curl -s http://localhost:3001/api/health || echo "WARNING: health check failed"
            echo "Deploy completed at $(date)"
