name: Deploy to Aliyun

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy frontend files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          HOST: 47.114.120.73
          USERNAME: admin
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SOURCE: "进度管理系统.html,xlsx.min.js"
          TARGET: "/var/www/jd-progress/"
          strip_components: 0

      - name: Copy backend file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          HOST: 47.114.120.73
          USERNAME: admin
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SOURCE: "backend/server.js"
          TARGET: "/var/www/jd-progress/backend/"
          strip_components: 1

      - name: Restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          HOST: 47.114.120.73
          USERNAME: admin
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /var/www/jd-progress
            chmod 644 /var/www/jd-progress/进度管理系统.html
            echo "=== Verifying role API exists ==="
            grep -n 'PUT.*role' /var/www/jd-progress/backend/server.js || (echo "ERROR: role API not found" && exit 1)
            echo "=== Stopping old backend ==="
            pm2 delete store-progress-api 2>/dev/null || true
            fuser -k 3001/tcp 2>/dev/null || true
            fuser -k 3002/tcp 2>/dev/null || true
            fuser -k 3003/tcp 2>/dev/null || true
            fuser -k 3004/tcp 2>/dev/null || true
            echo "=== Adding Nginx config for jd-progress ==="
            if ! grep -q 'location /jd' /etc/nginx/nginx.conf; then
              sudo sed -i '/server_name/i\    location /jd {\n        alias /var/www/jd-progress/;\n        index 进度管理系统.html;\n    }\n' /etc/nginx/nginx.conf
            fi
            echo "=== Updating nginx config to port 3004 ==="
            sudo sed -i 's/localhost:3002/localhost:3004/g' /etc/nginx/nginx.conf
            sudo sed -i 's/localhost:3003/localhost:3004/g' /etc/nginx/nginx.conf
            sudo nginx -t && sudo nginx -s reload || echo "nginx reload failed"
            echo "=== Starting new backend on port 3004 ==="
            cd /var/www/jd-progress/backend && PORT=3004 pm2 start server.js --name store-progress-api
            sleep 3
            echo "=== Checking backend status ==="
            pm2 list
            curl -s http://localhost:3004/api/health || echo "WARNING: health check failed"
            echo "Deploy completed at $(date)"
